c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture(e.pointerId);let p=pos(e);snapshot();if(mode==='fill')flood(p.x,p.y);else{drawing=true;last=p;stroke(p,{x:p.x+.01,y:p.y+.01})}});c.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();let p=pos(e);stroke(last,p);last=p});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>c.addEventListener(ev,()=>drawing=false));document.getElementById('undo').onclick=()=>{if(history.length)ctx.putImageData(history.pop(),0,0)};document.getElementById('reset').onclick=()=>{if(confirm('Start colouring again?')){snapshot();ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(source,0,0,c.width,c.height)}};document.getElementById('save').onclick=()=>{let a=document.createElement('a');a.download='My_Colourful_Niu.png';a.href=c.toDataURL('image/png');a.click()};</script></body></html>
